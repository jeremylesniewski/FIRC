# Syntax and quality checks for FIRC (macOS GUI app)
# Note: Full builds require macOS with tkinter and audio hardware
# See: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Syntax & Quality Check

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  syntax-check:
    name: Python Syntax & Lint Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    
    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8
    
    - name: Check syntax with flake8
      run: |
        # Stop on syntax errors and undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    
    - name: Code quality check
      run: |
        # Warn on complexity but don't fail
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Validate imports
      run: |
        python -m py_compile firc/*.py FIRC.py
